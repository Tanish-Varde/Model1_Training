<!-- Create a basic homepage with html only -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f7fb;
            color: #17324d;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 16px;
        }

        .page-shell {
            width: min(980px, 100%);
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: 0 18px 40px rgba(23, 50, 77, 0.12);
            padding: 28px;
        }

        .page-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .nav-links {
            display: flex;
            gap: 16px;
        }

        .nav-links a {
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .nav-links a:hover {
            color: #1d4ed8;
        }

        .content {
            font-size: 1.2em;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <header class="page-header">
            <h1>Welcome to the Home Page</h1>
            <nav class="nav-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
        </header>
        <main class="content">
            <p>This is a simple homepage created with HTML and CSS. It includes a header with navigation links and a
                main content area. You can customize this template to fit your needs.</p>
        </main>
    </div>
</body>

</html>
