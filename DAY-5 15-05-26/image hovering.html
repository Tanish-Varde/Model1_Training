<!doctype html>
<html>
  <head>
    <title>Big Image Hover Effect</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #eaeaea;
      }

      .image-box {
        width: 600px;
        height: 400px;
        overflow: hidden;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
      }

      .image-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.6s ease;
      }

      .image-box img:hover {
        transform: scale(1.15);
        filter: brightness(80%);
      }
    </style>
  </head>

  <body>
    <div class="image-box">
      <img
        src="https://plus.unsplash.com/premium_photo-1661963357054-5bfec1e9de24?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="Big Nature Image"
      />
    </div>
  </body>
</html>
