<!doctype html>
<html>
  <head>
    <title>Floating Water Hover Effect</title>

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #00111f, #004e92);
        overflow: hidden;
        font-family: Arial;
      }

      .icon-box {
        display: flex;
        gap: 35px;
      }

      .icon-box a {
        width: 100px;
        height: 100px;

        background: rgba(255, 255, 255, 0.1);

        border-radius: 50%;

        display: flex;
        justify-content: center;
        align-items: center;

        text-decoration: none;

        position: relative;

        overflow: hidden;

        backdrop-filter: blur(10px);

        border: 2px solid rgba(255, 255, 255, 0.2);

        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.4),
          inset 0 5px 10px rgba(255, 255, 255, 0.2);

        transition: 0.5s;
      }

      .icon-box a i {
        font-size: 40px;
        color: white;
        z-index: 2;
        transition: 0.5s;
      }

      /* Water Wave Effect */

      .icon-box a::before {
        content: "";

        position: absolute;

        width: 200%;
        height: 200%;

        background: rgba(255, 255, 255, 0.2);

        top: 100%;
        left: -50%;

        border-radius: 40%;

        transition: 1s;
      }

      .icon-box a:hover::before {
        top: -60%;

        animation: wave 3s linear infinite;
      }

      @keyframes wave {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      /* Floating Animation */

      .icon-box a:hover {
        transform: translateY(-20px);

        animation: float 2s ease-in-out infinite;
      }

      @keyframes float {
        0% {
          transform: translateY(-20px);
        }

        50% {
          transform: translateY(-35px);
        }

        100% {
          transform: translateY(-20px);
        }
      }

      /* Icon Animation */

      .icon-box a:hover i {
        transform: scale(1.2) rotate(360deg);

        color: #00e5ff;
      }

      /* Different Glow Colors */

      .icon-box a:nth-child(1):hover {
        box-shadow: 0 0 30px #ff0080;
      }

      .icon-box a:nth-child(2):hover {
        box-shadow: 0 0 30px #1877f2;
      }

      .icon-box a:nth-child(3):hover {
        box-shadow: 0 0 30px #ffffff;
      }

      .icon-box a:nth-child(4):hover {
        box-shadow: 0 0 30px #ff0000;
      }

      .icon-box a:nth-child(5):hover {
        box-shadow: 0 0 30px #ff1744;
      }
    </style>
  </head>

  <body>
    <div class="icon-box">
      <!-- Instagram -->
      <a href="#">
        <i class="fa-brands fa-instagram"></i>
      </a>

      <!-- Facebook -->
      <a href="#">
        <i class="fa-brands fa-facebook-f"></i>
      </a>

      <!-- GitHub -->
      <a href="#">
        <i class="fa-brands fa-github"></i>
      </a>

      <!-- YouTube -->
      <a href="#">
        <i class="fa-brands fa-youtube"></i>
      </a>

      <!-- Heart -->
      <a href="#">
        <i class="fa-solid fa-heart"></i>
      </a>
    </div>
  </body>
</html>
