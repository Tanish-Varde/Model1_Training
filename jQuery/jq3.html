<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Table</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --bg-1: #f4f7fb;
            --bg-2: #e8eef7;
            --card: rgba(255, 255, 255, 0.92);
            --text: #17324d;
            --muted: #5f7287;
            --line: #d6e0ea;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --shadow: 0 18px 40px rgba(23, 50, 77, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.14), transparent 34%),
                radial-gradient(circle at bottom right, rgba(220, 38, 38, 0.1), transparent 30%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            display: grid;
            place-items: center;
            padding: 32px 16px;
        }

        .page-shell {
            width: min(980px, 100%);
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 28px;
            backdrop-filter: blur(8px);
        }

        .page-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .page-header h1 {
            margin: 0;
            font-size: clamp(1.6rem, 2vw, 2.2rem);
            letter-spacing: -0.03em;
        }

        .page-header p {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .table-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: #fff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 640px;
        }

        thead th {
            text-align: left;
            padding: 16px 18px;
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            background: linear-gradient(180deg, #f8fbff, #eef4fb);
            border-bottom: 1px solid var(--line);
        }

        tbody td {
            padding: 16px 18px;
            border-bottom: 1px solid var(--line);
            font-size: 0.98rem;
        }

        tbody tr:nth-child(even) {
            background: #f9fbfd;
        }

        tbody tr:hover {
            background: #eef5ff;
        }

        .student-id {
            font-weight: 700;
            color: var(--accent);
        }

        .delete-button {
            appearance: none;
            border: 0;
            border-radius: 999px;
            padding: 10px 16px;
            background: linear-gradient(180deg, #ef4444, var(--danger));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(220, 38, 38, 0.22);
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .delete-button:hover {
            background: linear-gradient(180deg, #f87171, var(--danger-hover));
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(220, 38, 38, 0.28);
        }

        .delete-button:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.35);
            outline-offset: 2px;
        }

        .empty-state {
            display: none;
            padding: 28px 18px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 720px) {
            .page-shell {
                padding: 18px;
                border-radius: 18px;
            }

            .page-header {
                flex-direction: column;
                align-items: start;
            }
        }
    </style>
</head>

<body>
    <main class="page-shell">
        <div class="page-header">
            <div>
                <h1>Student Directory</h1>
                <p>Click Delete to remove a student row instantly.</p>
            </div>
        </div>

        <div class="table-wrap">
            <table id="student-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>City</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="student-row-1" data-student-id="1">
                        <td class="student-id">001</td>
                        <td>Alice</td>
                        <td>30</td>
                        <td>New York</td>
                        <td><button type="button" class="delete-button" data-student-id="1">Delete</button></td>
                    </tr>
                    <tr id="student-row-2" data-student-id="2">
                        <td class="student-id">002</td>
                        <td>Bob</td>
                        <td>25</td>
                        <td>Los Angeles</td>
                        <td><button type="button" class="delete-button" data-student-id="2">Delete</button></td>
                    </tr>
                    <tr id="student-row-3" data-student-id="3">
                        <td class="student-id">003</td>
                        <td>Charlie</td>
                        <td>35</td>
                        <td>Chicago</td>
                        <td><button type="button" class="delete-button" data-student-id="3">Delete</button></td>
                    </tr>
                </tbody>
            </table>
            <div class="empty-state" id="empty-state">No student records left.</div>
        </div>
    </main>

    <script>
        $(document).ready(function () {
            $('#student-table').on('click', '.delete-button', function () {
                var studentId = $(this).data('student-id');
                $('#student-row-' + studentId).remove();

                if ($('#student-table tbody tr').length === 0) {
                    $('#empty-state').show();
                    $('#student-table').hide();
                }
            });
        });
    </script>

</body>

</html>
